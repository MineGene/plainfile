version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised
    # version is likely to be caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /Packages/PlainfileCore
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
