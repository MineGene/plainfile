name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch breakage from runner, macOS or Xcode updates.
    - cron: "41 2 * * 1"
  workflow_dispatch:

# Read-only token; no secrets are used anywhere in CI, so fork PRs are safe.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-privacy:
    name: Commit privacy
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit emails and trailers
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: scripts/check-commits.sh "$BASE" "$HEAD"

  core-tests:
    name: Core tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Run tests
        run: swift test --package-path Packages/PlainfileCore

  build-app:
    name: Build and check app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build app
        run: scripts/build-app.sh
      - name: Check structure, signature and entitlements
        run: scripts/check-app.sh build/Release/Plainfile.app
      - name: Lint (advisory)
        continue-on-error: true
        run: xcrun swift-format lint --strict --recursive Plainfile PlainfileParser Packages/PlainfileCore
