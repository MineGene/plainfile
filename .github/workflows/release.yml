name: Release

# Start from the Actions tab (works from a phone): Release › Run workflow,
# enter a version like 0.2.0. The job waits for approval on the protected
# "release" environment, then builds main, tags it and publishes the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Xcode
        run: scripts/select-xcode.sh

      - name: Only release from main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] \
            || { echo "::error::Run the release from the main branch."; exit 1; }

      - name: Check version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Version must look like 1.2.3"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version has already been released."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test core
        run: swift test --package-path Packages/PlainfileCore

      - name: Build app
        env:
          PLAINFILE_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-app.sh

      - name: Check app
        run: scripts/check-app.sh build/Release/Plainfile.app

      - name: Record app digest
        id: digest
        run: |
          scripts/app-digest.sh build/Release/Plainfile.app > build/Plainfile-app-digest.txt
          echo "sha=$(shasum -a 256 build/Plainfile-app-digest.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "macos=$(sw_vers -productVersion)" >> "$GITHUB_OUTPUT"

      - name: Make DMG
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="Plainfile-$VERSION.dmg"
          staging=build/dmg
          rm -rf "$staging" && mkdir -p "$staging"
          ditto build/Release/Plainfile.app "$staging/Plainfile.app"
          ln -s /Applications "$staging/Applications"
          cp LICENSE "$staging/LICENSE.txt"
          hdiutil create -volname Plainfile -srcfolder "$staging" -fs HFS+ -format UDZO -ov "build/$name"
          (cd build && shasum -a 256 "$name" > "$name.sha256")
          cat "build/$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/Plainfile-${{ steps.version.outputs.version }}.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.dmg.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          APP_DIGEST: ${{ steps.digest.outputs.sha }}
          XCODE: ${{ steps.digest.outputs.xcode }}
          MACOS: ${{ steps.digest.outputs.macos }}
        run: |
          sha=$(cut -d' ' -f1 "build/$NAME.sha256")
          cp build/Plainfile-app-digest.txt "build/Plainfile-$VERSION-app-digest.txt"
          cat > build/notes.md <<EOF
          ## Install

          1. Download **$NAME** below, open it and drag Plainfile to Applications.
          2. Open Plainfile. macOS will say it can't verify the developer — Plainfile is free and not notarised by Apple.
          3. Open **System Settings › Privacy & Security**, scroll down and click **Open Anyway**, then confirm. Needed once per version.

          Only download Plainfile from this Releases page.

          ## Verify your download (optional)

          \`\`\`
          shasum -a 256 $NAME
          # should print: $sha
          gh attestation verify $NAME --repo $GITHUB_REPOSITORY
          \`\`\`

          ## Rebuild it yourself (optional)

          This release is reproducible: building commit \`$GITHUB_SHA\` with $XCODE gives an app with digest \`$APP_DIGEST\` (built on macOS $MACOS). Compare with \`scripts/app-digest.sh\`; the full file list is attached.

          ## Changes
          EOF
          gh release create "v$VERSION" \
            "build/$NAME" "build/$NAME.sha256" "build/Plainfile-$VERSION-app-digest.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Plainfile $VERSION" \
            --notes-file build/notes.md \
            --target "$GITHUB_SHA" \
            --generate-notes
