name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't attach personal photos, videos or documents.** They contain the very metadata this app is about.
        If a file is needed, make a fresh one just for this report.
        Security problems: report privately via the Security tab instead.
  - type: input
    id: version
    attributes:
      label: Plainfile version
      description: Plainfile › About Plainfile
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Air (M3)
    validations:
      required: true
  - type: input
    id: filetype
    attributes:
      label: File type involved
      placeholder: HEIC photo from an iPhone 17
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I haven't attached any personal files or screenshots showing personal metadata.
          required: true
